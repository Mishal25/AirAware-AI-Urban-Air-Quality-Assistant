<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="880" y1="40" x2="1120" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Subtle architectural grid lines -->
  <line x1="760" y1="0" x2="760" y2="360" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="292" x2="760" y2="292" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Brand mark -->
  <rect x="64" y="56" width="52" height="52" rx="14" fill="#0F766E"/>
  <circle cx="90" cy="82" r="14" stroke="#BAE6FD" stroke-width="2.5" stroke-dasharray="56 20"/>
  <path d="M81 84.5C84.2 78.8 90.6 75.2 98.5 75.2C97.8 83 93.8 89 87.3 90.5C84.2 91.1 81.8 89 81 84.5Z" fill="#E0F2FE"/>

  <text x="132" y="79" fill="#0F766E" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">URBAN AIR QUALITY ASSISTANT</text>
  <text x="132" y="103" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Live Atmospheric Telemetry &amp; Gemini Health Guidance</text>

  <text x="64" y="176" fill="#0F172A" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">AirAware AI</text>
  <text x="64" y="220" fill="#0F766E" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600">Breathe Smarter. Live Healthier.</text>
  <text x="64" y="258" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16">Real-time Open-Meteo pollutant monitoring, 72-hour forecasts, city comparison, and server-side Google Gemini insights.</text>

  <!-- Bottom tech strip -->
  <text x="64" y="330" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">React 19 · TypeScript · Tailwind CSS · Express · Open-Meteo CAMS · Google Gemini API</text>

  <!-- Right side AQI Gauge Motif -->
  <circle cx="980" cy="180" r="108" stroke="#E2E8F0" stroke-width="18" fill="#FFFFFF"/>
  <circle cx="980" cy="180" r="108" stroke="url(#ringGrad)" stroke-width="18" stroke-dasharray="510 680" stroke-linecap="round" transform="rotate(135 980 180)"/>
  <text x="980" y="160" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">US EPA / EAQI</text>
  <text x="980" y="202" text-anchor="middle" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="44" font-weight="800">GOOD</text>
  <text x="980" y="228" text-anchor="middle" fill="#0F766E" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">PM2.5 · PM10 · O3 · NO2</text>
</svg>
